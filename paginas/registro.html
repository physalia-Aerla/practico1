<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Aurora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Island+Moments&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="auth">

    <form id="registroForm" class="formulario">

        <h2>Crear Cuenta</h2>

        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" maxlength="80" required>

        <input type="email" id="email" name="email" placeholder="Correo electrónico" maxlength="100" required>

        <input type="password" id="password" name="password" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required>

        <input type="password" id="confirmar" name="confirmar" placeholder="Confirmar contraseña" minlength="8" required>

        <p id="registroError" class="error"></p>

        <button type="submit">
            Registrarse
        </button>

        <a href="../index.html" class="text-center text-decoration-none">
            Volver al inicio
        </a>

        <a href="login.html" class="text-center text-decoration-none">
            Ya tengo una cuenta
        </a>

    </form>

    <script src="../js/auth.js"></script>
    <script src="../js/registro.js"></script>

</body>

</html>
