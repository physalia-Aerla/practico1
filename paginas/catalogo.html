<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Aurora</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600&family=Island+Moments&family=Sail&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/styles.css">


</head>

<body>

<header class="header">
    <div class="container">


    <nav class="navbar navbar-expand-lg">

        <img src="../assets/imagenes/img1.png" class="logo-img" alt="logo">

        <a class="logo" href="../index.html">
            Aurora
        </a>

        <div class="collapse navbar-collapse justify-content-center">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="../index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Catálogo
                    </a>
                </li>

            </ul>
        </div>

        <div id="acciones-sesion" class="d-flex gap-2">
            <a href="login.html" class="btn-login">Iniciar sesión</a>
            <a href="registro.html" class="btn-registro">Registrarse</a>
        </div>

        <img src="../assets/imagenes/img2.png" class="perfil-img" alt="perfil">

    </nav>

</div>


</header>

<!-- El contenido del catálogo se carga desde la API (/api/libros) con js/catalogo.js -->

<section class="top3">
    <div class="container">


    <h2 class="titulo-seccion text-white">
        Top 3 Destacados
    </h2>

    <div id="top3" class="row g-4"></div>

</div>


</section>

<section class="libros">
    <div class="container">


    <h2 class="titulo-seccion text-white">
        Libros
    </h2>

    <div class="catalogo-container">

        <button class="arrow" onclick="moverCatalogo('libros',-1)">&#10094;</button>

        <div class="catalogo-viewport">

            <div class="catalogo-track libros-track"></div>

        </div>

        <button class="arrow" onclick="moverCatalogo('libros',1)">&#10095;</button>

    </div>

</div>


</section>

<section class="audiolibros">
    <div class="container">


    <h2 class="titulo-seccion">
        Audiolibros
    </h2>

    <div class="catalogo-container">

        <button class="arrow" onclick="moverCatalogo('audio',-1)">&#10094;</button>

        <div class="catalogo-viewport">

            <div class="catalogo-track audio-track"></div>

        </div>

        <button class="arrow" onclick="moverCatalogo('audio',1)">&#10095;</button>

    </div>

</div>


</section>

<section class="revistas">
    <div class="container">


    <h2 class="titulo-seccion text-white">
        Revistas
    </h2>

    <div class="catalogo-container">

        <button class="arrow" onclick="moverCatalogo('revistas',-1)">&#10094;</button>

        <div class="catalogo-viewport">

            <div class="catalogo-track revistas-track"></div>

        </div>

        <button class="arrow" onclick="moverCatalogo('revistas',1)">&#10095;</button>

    </div>

</div>


</section>

<script src="../js/java.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/catalogo.js"></script>
<script>mostrarSesionEnHeader();</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
