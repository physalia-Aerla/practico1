<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración - Aurora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Island+Moments&family=Sail&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body class="panel" style="visibility: hidden;">
    <div class="row g-0">

        <aside class="panel-sidebar col-12 col-lg-2 p-3">
            <a class="logo d-block mb-3" href="../../index.html">Aurora</a>
            <nav class="nav flex-lg-column">
                <a class="nav-link" href="#catalogo">Catálogo</a>
                <a class="nav-link" href="../../index.html">Sitio público</a>
                <a class="nav-link" href="#" onclick="cerrarSesion(); return false;">Cerrar sesión</a>
            </nav>
        </aside>

        <div class="col-12 col-lg-10">

            <header class="panel-header d-flex flex-wrap justify-content-between align-items-center gap-2 p-3">
                <h1 class="h3 m-0">Panel de administración</h1>
                <div class="d-flex align-items-center gap-3">
                    <span><strong id="nombre"></strong> (<span id="rol"></span>)</span>
                    <button type="button" class="btn-login" onclick="cerrarSesion()">Cerrar sesión</button>
                </div>
            </header>

            <main class="p-3">
                <section id="catalogo" class="card p-3">
                    <h2 class="h4">Catálogo (<span id="totalCatalogo">0</span> artículos)</h2>
                    <p class="text-muted">La carga, edición y baja de artículos va a estar disponible próximamente.</p>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle m-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Título</th>
                                    <th>Tipo</th>
                                    <th>Autor</th>
                                    <th>Editorial</th>
                                    <th>Precio</th>
                                    <th>Destacado</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCatalogo"></tbody>
                        </table>
                    </div>
                </section>
            </main>

        </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
</body>

</html>
